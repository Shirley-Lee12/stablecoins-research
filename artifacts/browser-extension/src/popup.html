<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZIBS Connector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <img src="icons/icon-48.png" alt="" />
      <div><strong>ZIBS Connector</strong><span>Stablecoin Research Hub</span></div>
      <button id="settingsButton" class="icon-button" title="连接设置 / Connection settings" aria-label="连接设置">⋯</button>
    </header>

    <main>
      <section id="loadingView" class="center-view"><span class="spinner"></span><p>正在检查连接…</p></section>

      <section id="disconnectedView" class="hidden">
        <div class="status-mark">↗</div>
        <h1>连接研究资源库</h1>
        <p>授权后即可把当前网页中的论文、图书、法规、报告和数据集送入待确认队列。</p>
        <button id="connectButton" class="primary-button">连接 ZIBS Research Hub</button>
        <div id="pairingPanel" class="pairing hidden">
          <span>配对码</span><strong id="pairingCode">----</strong>
          <p>请在刚打开的网站页面完成登录与授权，然后返回这里。</p>
          <button id="checkPairingButton" class="secondary-button">检查授权状态</button>
        </div>
      </section>

      <section id="captureView" class="hidden">
        <div class="account-row"><span id="accountName">已连接</span><span class="connected-dot">已连接</span></div>
        <div id="emptyCapture" class="capture-empty">
          <div class="capture-icon">＋</div>
          <h1>采集当前页面</h1>
          <p>插件优先读取网页自带题录；缺失字段会由 AI 补全，提交后仍需人工确认。</p>
          <button id="captureButton" class="primary-button">读取当前页面</button>
        </div>
        <div id="previewPanel" class="hidden">
          <div class="preview-heading">
            <p class="eyebrow">采集预览</p>
            <span id="readStatus" class="read-status" role="status"></span>
          </div>
          <p class="edit-hint">提交前可直接修改以下题录信息。</p>
          <div class="field-stack">
            <label><span>标题</span><textarea id="editTitle" rows="2" maxlength="1000"></textarea></label>
            <label><span>作者</span><textarea id="editAuthors" rows="2" maxlength="15000" placeholder="多位作者请用分号分隔"></textarea></label>
            <div class="field-grid">
              <label><span>日期</span><input id="editDate" type="text" maxlength="100" placeholder="2026 或 2026-08-30" /></label>
              <label><span>类型</span><select id="editType">
                <option value="journal_article">期刊论文</option>
                <option value="working_paper">工作论文</option>
                <option value="conference_paper">会议论文</option>
                <option value="thesis">学位论文</option>
                <option value="book">图书 / 专著</option>
                <option value="book_chapter">图书章节</option>
                <option value="dataset">数据集</option>
                <option value="report">报告</option>
                <option value="gov_document">法规/政府文件</option>
                <option value="news">新闻</option>
              </select></label>
            </div>
            <label><span>DOI</span><input id="editDoi" type="text" maxlength="300" placeholder="未检测到" /></label>
            <label><span>网页链接</span><textarea id="editUrl" rows="2" maxlength="4096"></textarea></label>
            <label><span>摘要</span><textarea id="editAbstract" rows="4" maxlength="20000" placeholder="待 AI 补全"></textarea></label>
            <label><span>关键词</span><textarea id="editKeywords" rows="2" maxlength="6000" placeholder="多个关键词请用分号分隔"></textarea></label>
          </div>
          <p id="aiNotice" class="notice"></p>
          <div class="button-row">
            <button id="recaptureButton" class="secondary-button">重新读取</button>
            <button id="submitButton" class="primary-button">送入待确认</button>
          </div>
        </div>
        <div id="successPanel" class="success hidden">
          <div class="success-mark">✓</div><h1>已送入待确认队列</h1>
          <p id="successMessage"></p>
          <button id="openReviewButton" class="primary-button">在网站中审核</button>
          <button id="captureAnotherButton" class="text-button">继续采集其他页面</button>
        </div>
      </section>

      <section id="settingsView" class="hidden">
        <button id="backButton" class="back-button">← 返回</button>
        <h1>连接设置</h1>
        <p class="settings-copy">授权仅允许提交网页采集，不可管理用户或自动审核资源。</p>
        <div class="setting-line"><span>版本</span><strong id="versionLabel"></strong></div>
        <button id="disconnectButton" class="danger-button">断开此浏览器</button>
      </section>

      <p id="errorBanner" class="error hidden"></p>
    </main>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
