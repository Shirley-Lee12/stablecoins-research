<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Three Fund-Control Models</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.s{font-size:20px} .b{font-size:24px} .l{font-size:24px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Three Fund-Control Models</text><text x="90" y="130" class="m s" text-anchor="start">An agent can execute a payment without receiving unrestricted access to the underlying account.</text><rect x="70" y="185" width="475" height="585" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><circle cx="122" cy="235" r="27" fill="#315B9A"/><text x="122" y="243" class="t l" text-anchor="middle" fill="#FFFFFF">A</text><text x="162" y="244" class="t l" text-anchor="start" fill="#315B9A">Mandate Model</text><text x="105" y="292" class="t s" text-anchor="start" fill="#667085"><tspan x="105" dy="0">Task authority,</tspan><tspan x="105" dy="26">not full account control.</tspan></text><rect x="150" y="370" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="307" y="404" class="t s" text-anchor="middle" fill="#1F2937">User</text><line x1="307" y1="424" x2="307" y2="448" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="452" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="307" y="486" class="t s" text-anchor="middle" fill="#1F2937">Structured mandate</text><line x1="307" y1="506" x2="307" y2="530" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="534" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="307" y="568" class="t s" text-anchor="middle" fill="#1F2937">Agent</text><line x1="307" y1="588" x2="307" y2="612" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="616" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="307" y="650" class="t s" text-anchor="middle" fill="#1F2937">Verifier</text><line x1="307" y1="670" x2="307" y2="694" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="698" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="307" y="732" class="t s" text-anchor="middle" fill="#1F2937">Payment</text><text x="105" y="825" class="m s" text-anchor="start">Example: AP2 / APOP</text><rect x="585" y="185" width="475" height="585" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><circle cx="637" cy="235" r="27" fill="#3A7D78"/><text x="637" y="243" class="t l" text-anchor="middle" fill="#FFFFFF">B</text><text x="677" y="244" class="t l" text-anchor="start" fill="#3A7D78">Scoped Credential</text><text x="620" y="292" class="t s" text-anchor="start" fill="#667085"><tspan x="620" dy="0">One-time or restricted</tspan><tspan x="620" dy="26">payment credential.</tspan></text><rect x="665" y="370" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="822" y="404" class="t s" text-anchor="middle" fill="#1F2937">User approval</text><line x1="822" y1="424" x2="822" y2="448" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="665" y="452" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="822" y="486" class="t s" text-anchor="middle" fill="#1F2937">PSP / wallet</text><line x1="822" y1="506" x2="822" y2="530" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="665" y="534" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="822" y="568" class="t s" text-anchor="middle" fill="#1F2937">Scoped token</text><line x1="822" y1="588" x2="822" y2="612" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="665" y="616" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="822" y="650" class="t s" text-anchor="middle" fill="#1F2937">Agent</text><line x1="822" y1="670" x2="822" y2="694" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="665" y="698" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="822" y="732" class="t s" text-anchor="middle" fill="#1F2937">Merchant</text><text x="620" y="825" class="m s" text-anchor="start">Example: ACP / Muse + Link</text><rect x="1100" y="185" width="475" height="585" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><circle cx="1152" cy="235" r="27" fill="#6B65A8"/><text x="1152" y="243" class="t l" text-anchor="middle" fill="#FFFFFF">C</text><text x="1192" y="244" class="t l" text-anchor="start" fill="#6B65A8">Platform Account + Approval</text><text x="1135" y="292" class="t s" text-anchor="start" fill="#667085"><tspan x="1135" dy="0">Agent proposes; user approves;</tspan><tspan x="1135" dy="26">platform account pays.</tspan></text><rect x="1180" y="370" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="1337" y="404" class="t s" text-anchor="middle" fill="#1F2937">Platform account</text><line x1="1337" y1="424" x2="1337" y2="448" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1180" y="452" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="1337" y="486" class="t s" text-anchor="middle" fill="#1F2937">Agent proposal</text><line x1="1337" y1="506" x2="1337" y2="530" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1180" y="534" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="1337" y="568" class="t s" text-anchor="middle" fill="#1F2937">Allow / Deny</text><line x1="1337" y1="588" x2="1337" y2="612" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1180" y="616" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="1337" y="650" class="t s" text-anchor="middle" fill="#1F2937">Payment</text><line x1="1337" y1="670" x2="1337" y2="694" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1180" y="698" width="315" height="54" rx="12" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="1337" y="732" class="t s" text-anchor="middle" fill="#1F2937">Merchant</text><text x="1135" y="825" class="m s" text-anchor="start">Example: Grok Bot + X Money</text></svg>