<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Autonomy Levels</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.s{font-size:20px} .b{font-size:24px} .l{font-size:24px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">How Much Control Does the Agent Have?</text><text x="90" y="130" class="m s" text-anchor="start">More autonomy requires stronger identity, limits, monitoring and audit.</text><rect x="90" y="205" width="440" height="500" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><circle cx="145" cy="255" r="28" fill="#315B9A"/><text x="145" y="263" class="t l" text-anchor="middle" fill="#FFFFFF">1</text><text x="190" y="264" class="t l" text-anchor="start" fill="#315B9A">Human-confirmed</text><text x="190" y="300" class="m s" text-anchor="start">每次都问我</text><text x="128" y="355" class="t s" text-anchor="start" fill="#1F2937">• Find and compare</text><text x="128" y="389" class="t s" text-anchor="start" fill="#1F2937">• Show final amount</text><text x="128" y="423" class="t s" text-anchor="start" fill="#1F2937">• User approves</text><text x="128" y="457" class="t s" text-anchor="start" fill="#1F2937">• Pay</text><line x1="125" y1="500" x2="495" y2="500" stroke="#C8D2E1" stroke-width="2"/><text x="125" y="540" class="m s" text-anchor="start">Examples</text><rect x="125" y="565" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="270.0" y="592.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">Instant Checkout</text><rect x="125" y="612" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="270.0" y="639.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">Muse</text><rect x="125" y="659" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="270.0" y="686.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">Grok Bot</text><rect x="595" y="205" width="440" height="500" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><circle cx="650" cy="255" r="28" fill="#6B65A8"/><text x="650" y="263" class="t l" text-anchor="middle" fill="#FFFFFF">2</text><text x="695" y="264" class="t l" text-anchor="start" fill="#6B65A8">Pre-authorized</text><text x="695" y="300" class="m s" text-anchor="start">满足条件就可以买</text><text x="633" y="355" class="t s" text-anchor="start" fill="#1F2937">• Amount cap</text><text x="633" y="389" class="t s" text-anchor="start" fill="#1F2937">• Merchant / category</text><text x="633" y="423" class="t s" text-anchor="start" fill="#1F2937">• Time / frequency</text><text x="633" y="457" class="t s" text-anchor="start" fill="#1F2937">• Execute within limits</text><line x1="630" y1="500" x2="1000" y2="500" stroke="#C8D2E1" stroke-width="2"/><text x="630" y="540" class="m s" text-anchor="start">Examples</text><rect x="630" y="565" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="775.0" y="592.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">AP2 mandate</text><rect x="630" y="612" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="775.0" y="639.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">AMP task auth</text><rect x="630" y="659" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="775.0" y="686.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">APOP intent</text><rect x="1100" y="205" width="440" height="500" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><circle cx="1155" cy="255" r="28" fill="#3A7D78"/><text x="1155" y="263" class="t l" text-anchor="middle" fill="#FFFFFF">3</text><text x="1200" y="264" class="t l" text-anchor="start" fill="#3A7D78">Machine-native</text><text x="1200" y="300" class="m s" text-anchor="start">机器自动付款</text><text x="1138" y="355" class="t s" text-anchor="start" fill="#1F2937">• Request resource</text><text x="1138" y="389" class="t s" text-anchor="start" fill="#1F2937">• Receive payment request</text><text x="1138" y="423" class="t s" text-anchor="start" fill="#1F2937">• Pay under policy</text><text x="1138" y="457" class="t s" text-anchor="start" fill="#1F2937">• Get resource</text><line x1="1135" y1="500" x2="1505" y2="500" stroke="#C8D2E1" stroke-width="2"/><text x="1135" y="540" class="m s" text-anchor="start">Examples</text><rect x="1135" y="565" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="1280.0" y="592.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">x402</text><rect x="1135" y="612" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="1280.0" y="639.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">MPP</text><rect x="1135" y="659" width="290" height="40" rx="20.0" fill="#EEF3F9"/><text x="1280.0" y="686.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">A402 / Machine Pay</text><text x="100" y="790" class="t s" text-anchor="start" fill="#315B9A">Human control</text><text x="1500" y="790" class="t s" text-anchor="end" fill="#3A7D78">Automation</text><line x1="230" y1="782" x2="1370" y2="782" stroke="#C8D2E1" stroke-width="8" stroke-linecap="round"/><circle cx="520" cy="782" r="10" fill="#315B9A"/><circle cx="800" cy="782" r="10" fill="#6B65A8"/><circle cx="1080" cy="782" r="10" fill="#3A7D78"/></svg>