<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Protocol vs Product vs Infrastructure</title>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <style>
    .t { font-family: Inter, "Noto Sans SC", "PingFang SC", Arial, sans-serif; fill:#1F2937; }
    .muted { font-family: Inter, "Noto Sans SC", "PingFang SC", Arial, sans-serif; fill:#667085; }
    .small { font-size:22px; }
    .body { font-size:26px; }
    .label { font-size:24px; font-weight:600; }
    .title { font-size:44px; font-weight:700; }
    .sub { font-size:24px; }
    .box { fill:#FFFFFF; stroke:#C8D2E1; stroke-width:2; rx:18; ry:18; }
    .arrow { stroke:#C8D2E1; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .dash { stroke-dasharray:10 8; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/>
    </marker>
  </defs>
<text x="90" y="90" class="t title" text-anchor="start">Protocol ≠ Product ≠ Infrastructure</text><text x="90" y="130" class="muted small" text-anchor="start">Different artifacts solve different parts of the stack.</text><rect x="80" y="190" width="455" height="540" rx="18" ry="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="110" y="248" class="t label" text-anchor="start" fill="#315B9A">Protocol / Standard</text><rect x="110" y="310" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="340.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">UCP</text><rect x="110" y="362" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="392.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">ACP</text><rect x="110" y="414" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="444.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">AP2</text><rect x="110" y="466" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="496.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">ACT</text><rect x="110" y="518" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="548.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">AMP</text><rect x="110" y="570" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="600.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">APOP</text><rect x="110" y="622" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="652.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">x402</text><rect x="110" y="674" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="240.0" y="704.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">MPP</text><rect x="585" y="190" width="455" height="540" rx="18" ry="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="615" y="248" class="t label" text-anchor="start" fill="#6B65A8">Product / Solution</text><rect x="615" y="310" width="340" height="44" rx="22.0" fill="#EEF3F9"/><text x="785.0" y="340.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Instant Checkout</text><rect x="615" y="362" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="745.0" y="392.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Agent Pay</text><rect x="615" y="414" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="745.0" y="444.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Machine Pay</text><rect x="615" y="466" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="745.0" y="496.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">JD AI Pay</text><rect x="615" y="518" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="745.0" y="548.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Muse</text><rect x="615" y="570" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="745.0" y="600.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">X Money</text><rect x="615" y="622" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="745.0" y="652.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Antom</text><rect x="1090" y="190" width="455" height="540" rx="18" ry="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1120" y="248" class="t label" text-anchor="start" fill="#3A7D78">Infrastructure / Rail</text><rect x="1120" y="310" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="1250.0" y="340.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Stripe</text><rect x="1120" y="362" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="1250.0" y="392.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Visa</text><rect x="1120" y="414" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="1250.0" y="444.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Mastercard</text><rect x="1120" y="466" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="1250.0" y="496.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">UnionPay</text><rect x="1120" y="518" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="1250.0" y="548.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Bank account</text><rect x="1120" y="570" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="1250.0" y="600.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Wallet</text><rect x="1120" y="622" width="260" height="44" rx="22.0" fill="#EEF3F9"/><text x="1250.0" y="652.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Stablecoin</text><rect x="1120" y="674" width="340" height="44" rx="22.0" fill="#EEF3F9"/><text x="1290.0" y="704.0" class="t small" text-anchor="middle" fill="#315B9A" font-weight="600">Tokenised deposit</text><line x1="535" y1="465" x2="585" y2="465" stroke="#C8D2E1" stroke-width="4" marker-end="url(#arrow)"/><line x1="1040" y1="465" x2="1090" y2="465" stroke="#C8D2E1" stroke-width="4" marker-end="url(#arrow)"/><text x="235" y="785" class="muted small" text-anchor="start">Defines how parties coordinate</text><text x="725" y="785" class="muted small" text-anchor="start">Delivers a user/merchant experience</text><text x="1190" y="785" class="muted small" text-anchor="start">Moves or settles value</text><rect x="500" y="835" width="600" height="44" rx="22.0" fill="#FFF2EA"/><text x="800.0" y="865.0" class="t small" text-anchor="middle" fill="#C97B63" font-weight="600">A402: product-embedded 402/A2M method/spec</text></svg>