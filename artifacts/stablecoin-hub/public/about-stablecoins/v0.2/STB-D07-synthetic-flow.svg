<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Synthetic / Hedged Stablecoin Flow</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
