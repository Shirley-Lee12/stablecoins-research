</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Synthetic / Hedged: Backing + Hedge</text><text x="90" y="130" class="m s" text-anchor="start">Stability depends on both asset backing and the performance of the hedge/custody stack.</text><rect x="80" y="230" width="310" height="180" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="100" y="280" class="t l" text-anchor="start" fill="#315B9A">Backing assets</text><text x="100" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="100" dy="0">crypto assets</tspan><tspan x="100" dy="30">staked assets</tspan></text><line x1="390" y1="320" x2="445" y2="320" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="445" y="230" width="310" height="180" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="465" y="280" class="t l" text-anchor="start" fill="#3A7D78">Custody / OES</text><text x="465" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="465" dy="0">custodians</tspan><tspan x="465" dy="30">settlement infrastructure</tspan></text><line x1="755" y1="320" x2="810" y2="320" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="810" y="230" width="310" height="180" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="830" y="280" class="t l" text-anchor="start" fill="#6B65A8">Derivative hedge</text><text x="830" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="830" dy="0">short / offsetting exposure</tspan><tspan x="830" dy="30">exchange venues</tspan></text><line x1="1120" y1="320" x2="1175" y2="320" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1175" y="230" width="310" height="180" rx="18" fill="#FFFFFF" stroke="#C97B63" stroke-width="2"/><text x="1195" y="280" class="t l" text-anchor="start" fill="#C97B63">Synthetic dollar exposure</text><text x="1195" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1195" dy="0">USDe-like token</tspan><tspan x="1195" dy="30">secondary liquidity</tspan></text><rect x="220" y="500" width="520" height="130" rx="18" fill="#F8F7FC" stroke="#6B65A8" stroke-width="2"/><text x="480" y="545" class="t s" text-anchor="middle" fill="#6B65A8" font-weight="600">Hedge maintenance</text><text x="480" y="585" class="t s" text-anchor="middle" fill="#1F2937">funding · basis · PnL · execution</text><line x1="480" y1="500" x2="835" y2="410" stroke="#6B65A8" stroke-width="4" marker-end="url(#a)" stroke-dasharray="10 8"/><rect x="850" y="500" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1000" y="545" class="t s" text-anchor="middle" fill="#3A7D78" font-weight="600">Eligible direct counterparty</text><text x="1000" y="585" class="t xs" text-anchor="middle" fill="#1F2937">whitelisted mint / redeem</text><rect x="1200" y="500" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1350" y="545" class="t s" text-anchor="middle" fill="#94A3B8" font-weight="600">Secondary holder</text><text x="1350" y="585" class="t xs" text-anchor="middle" fill="#1F2937">market access ≠ same rights</text><rect x="380" y="750" width="840" height="70" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="793" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Synthetic / hedged ≠ classic endogenous algorithmic stablecoin.</text></svg>