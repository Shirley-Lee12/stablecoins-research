</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Hybrid &amp; Boundary Cases</text><text x="90" y="130" class="m s" text-anchor="start">Classify today&#x27;s economic mechanism, not the project&#x27;s historical reputation.</text><rect x="590" y="325" width="420" height="180" rx="80" fill="#F3F7FC" stroke="#315B9A" stroke-width="2"/><text x="800" y="395" class="t l" text-anchor="middle" fill="#315B9A">Classify today&#x27;s</text><text x="800" y="435" class="t l" text-anchor="middle" fill="#315B9A">economic mechanism</text><rect x="90" y="225" width="390" height="430" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="285" y="275" class="t l" text-anchor="middle" fill="#6B65A8">Mechanism migration</text><text x="135" y="345" class="t s" text-anchor="start" fill="#1F2937">• reserve mix changes</text><text x="135" y="403" class="t s" text-anchor="start" fill="#1F2937">• new redemption path</text><text x="135" y="461" class="t s" text-anchor="start" fill="#1F2937">• RWA / tokenised Treasuries</text><text x="135" y="519" class="t s" text-anchor="start" fill="#1F2937">• governance / issuer changes</text><text x="135" y="577" class="t s" text-anchor="start" fill="#1F2937">• hybrid stabilisation</text><line x1="480" y1="440" x2="590" y2="415" stroke="#6B65A8" stroke-width="4" marker-end="url(#a)"/><rect x="1120" y="225" width="390" height="430" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1315" y="275" class="t l" text-anchor="middle" fill="#3A7D78">Adjacent digital money</text><text x="1165" y="345" class="t s" text-anchor="start" fill="#1F2937">• CBDC</text><text x="1165" y="403" class="t s" text-anchor="start" fill="#1F2937">• tokenised deposit</text><text x="1165" y="461" class="t s" text-anchor="start" fill="#1F2937">• tokenised MMF / Treasury share</text><text x="1165" y="519" class="t s" text-anchor="start" fill="#1F2937">• yield-bearing wrapper</text><text x="1165" y="577" class="t s" text-anchor="start" fill="#1F2937">• other tokenised claims</text><line x1="1120" y1="440" x2="1010" y2="415" stroke="#3A7D78" stroke-width="4" marker-end="url(#a)"/><rect x="290" y="720" width="1020" height="82" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="756" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Current frxUSD example: reserve-backed / fiat-redeemable under current documentation.</text><text x="800" y="786" class="t xs" text-anchor="middle" fill="#667085">Historical project labels should not override the current mechanism.</text></svg>