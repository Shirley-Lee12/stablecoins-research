<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Mechanism-first Stablecoin Taxonomy</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.xs{font-size:18px} .s{font-size:20px} .b{font-size:24px} .l{font-size:27px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Mechanism-first Stablecoin Taxonomy</text><text x="90" y="130" class="m s" text-anchor="start">Use labels as teaching groups. Classify the mechanism that exists today.</text><rect x="80" y="200" width="1440" height="125" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="110" y="242" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">1 · Economic support</text><rect x="400" y="235" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="500" y="262" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="500" dy="0">cash / T-bills</tspan></text><rect x="615" y="235" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="715" y="262" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="715" dy="0">crypto</tspan><tspan x="715" dy="21">collateral</tspan></text><rect x="830" y="235" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="930" y="262" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="930" dy="0">hedged</tspan><tspan x="930" dy="21">backing</tspan></text><rect x="1045" y="235" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="1145" y="262" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="1145" dy="0">endogenous</tspan><tspan x="1145" dy="21">token</tspan></text><rect x="1260" y="235" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="1360" y="262" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="1360" dy="0">mixed</tspan></text><rect x="80" y="350" width="1440" height="125" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="110" y="392" class="t s" text-anchor="start" fill="#3A7D78" font-weight="600">2 · Exit / redemption</text><rect x="400" y="385" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="500" y="412" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="500" dy="0">issuer</tspan><tspan x="500" dy="21">redemption</tspan></text><rect x="615" y="385" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="715" y="412" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="715" dy="0">collateral</tspan><tspan x="715" dy="21">redemption</tspan></text><rect x="830" y="385" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="930" y="412" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="930" dy="0">restricted direct</tspan><tspan x="930" dy="21">mint / redeem</tspan></text><rect x="1045" y="385" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="1145" y="412" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="1145" dy="0">secondary-</tspan><tspan x="1145" dy="21">market exit</tspan></text><rect x="1260" y="385" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="1360" y="412" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="1360" dy="0">multiple paths</tspan></text><rect x="80" y="500" width="1440" height="125" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="110" y="542" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">3 · Stabilisation</text><rect x="400" y="535" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="500" y="562" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="500" dy="0">primary-market</tspan><tspan x="500" dy="21">arbitrage</tspan></text><rect x="615" y="535" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="715" y="562" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="715" dy="0">liquidation +</tspan><tspan x="715" dy="21">redemption</tspan></text><rect x="830" y="535" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="930" y="562" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="930" dy="0">delta hedge</tspan></text><rect x="1045" y="535" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="1145" y="562" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="1145" dy="0">supply / endogenous</tspan><tspan x="1145" dy="21">arbitrage</tspan></text><rect x="1260" y="535" width="200" height="62" rx="12" fill="#F8FAFC" stroke="#C8D2E1" stroke-width="2"/><text x="1360" y="562" class="t xs" text-anchor="middle" fill="#1F2937"><tspan x="1360" dy="0">combined</tspan></text><rect x="85" y="665" width="270" height="82" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="220" y="715" class="t s" text-anchor="middle" fill="#315B9A" font-weight="600">Fiat-reserve-backed</text><rect x="372" y="665" width="270" height="82" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="507" y="715" class="t s" text-anchor="middle" fill="#3A7D78" font-weight="600">Crypto-collateralised</text><rect x="659" y="665" width="270" height="82" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="794" y="715" class="t s" text-anchor="middle" fill="#6B65A8" font-weight="600">Synthetic / hedged</text><rect x="946" y="665" width="270" height="82" rx="18" fill="#FFFFFF" stroke="#C97B63" stroke-width="2"/><text x="1081" y="715" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Algorithmic</text><rect x="1233" y="665" width="270" height="82" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1368" y="715" class="t s" text-anchor="middle" fill="#94A3B8" font-weight="600">Hybrid / boundary</text><text x="800" y="815" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Classify the current mechanism — not the project&#x27;s historical reputation.</text></svg>