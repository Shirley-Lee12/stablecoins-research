<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Research Pipeline &amp; Status</text><text x="90" y="130" class="m s" text-anchor="start">Arrows show research dependency — not that every stage is finished.</text><rect x="38" y="245" width="235" height="345" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="56" y="293" class="t s" text-anchor="start" fill="#315B9A"><tspan x="56" dy="0">Conceptual</tspan><tspan x="56" dy="24">framework</tspan></text><rect x="56" y="360" width="199" height="38" rx="19.0" fill="#F1F4F8"/><text x="155.5" y="385.0" class="t xs" text-anchor="middle" fill="#315B9A" font-weight="600">COMPLETED</text><text x="56" y="450" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="56" dy="0">55-risk taxonomy</tspan><tspan x="56" dy="30">lifecycle × amplification</tspan></text><line x1="273" y1="417" x2="302" y2="417" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="302" y="245" width="235" height="345" rx="18" fill="#FFFFFF" stroke="#5F7DB5" stroke-width="2"/><text x="320" y="293" class="t s" text-anchor="start" fill="#5F7DB5"><tspan x="320" dy="0">Measurement</tspan><tspan x="320" dy="24">design</tspan></text><rect x="320" y="360" width="199" height="38" rx="19.0" fill="#F1F4F8"/><text x="419.5" y="385.0" class="t xs" text-anchor="middle" fill="#5F7DB5" font-weight="600">REFINING</text><text x="320" y="450" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="320" dy="0">construct → indicator</tspan><tspan x="320" dy="30">data feasibility</tspan></text><line x1="537" y1="417" x2="566" y2="417" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="566" y="245" width="235" height="345" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="584" y="293" class="t s" text-anchor="start" fill="#3A7D78"><tspan x="584" dy="0">Audited</tspan><tspan x="584" dy="24">data</tspan></text><rect x="584" y="360" width="199" height="38" rx="19.0" fill="#F1F4F8"/><text x="683.5" y="385.0" class="t xs" text-anchor="middle" fill="#3A7D78" font-weight="600">ESTABLISHED</text><text x="584" y="450" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="584" dy="0">issuance · reserves</tspan><tspan x="584" dy="30">chain · market · macro</tspan></text><line x1="801" y1="417" x2="830" y2="417" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="830" y="245" width="235" height="345" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="848" y="293" class="t s" text-anchor="start" fill="#6B65A8"><tspan x="848" dy="0">Transmission</tspan><tspan x="848" dy="24">models</tspan></text><rect x="848" y="360" width="199" height="38" rx="19.0" fill="#F1F4F8"/><text x="947.5" y="385.0" class="t xs" text-anchor="middle" fill="#6B65A8" font-weight="600">INTERIM</text><text x="848" y="450" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="848" dy="0">Transfer Entropy</tspan><tspan x="848" dy="30">Multivariate Hawkes</tspan></text><line x1="1065" y1="417" x2="1094" y2="417" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1094" y="245" width="235" height="345" rx="18" fill="#FFFFFF" stroke="#C97B63" stroke-width="2"/><text x="1112" y="293" class="t s" text-anchor="start" fill="#C97B63"><tspan x="1112" dy="0">Validation</tspan></text><rect x="1112" y="360" width="199" height="38" rx="19.0" fill="#F1F4F8"/><text x="1211.5" y="385.0" class="t xs" text-anchor="middle" fill="#C97B63" font-weight="600">IN PROGRESS</text><text x="1112" y="450" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="1112" dy="0">cases · stress · robustness</tspan><tspan x="1112" dy="30">reproducibility · OOS</tspan></text><line x1="1329" y1="417" x2="1358" y2="417" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1358" y="245" width="235" height="345" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1376" y="293" class="t s" text-anchor="start" fill="#94A3B8"><tspan x="1376" dy="0">Monitoring</tspan></text><rect x="1376" y="360" width="199" height="38" rx="19.0" fill="#F1F4F8"/><text x="1475.5" y="385.0" class="t xs" text-anchor="middle" fill="#94A3B8" font-weight="600">PLANNED</text><text x="1376" y="450" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="1376" dy="0">continuous signals</tspan><tspan x="1376" dy="30">interpretable warnings</tspan></text><rect x="235" y="690" width="1130" height="95" rx="16" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="800" y="730" class="t s" text-anchor="middle" fill="#667085" font-weight="600">Current public state</text><text x="800" y="765" class="t s" text-anchor="middle" fill="#1F2937">Conceptual outputs are public; quantitative models remain research-stage and under validation.</text></svg>