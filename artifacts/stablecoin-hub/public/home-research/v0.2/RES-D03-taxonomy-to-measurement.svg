<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>From Taxonomy to Measurement</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.s{font-size:20px} .b{font-size:24px} .l{font-size:26px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">From Taxonomy to Measurement</text><text x="90" y="130" class="m s" text-anchor="start">The 55-risk framework is a conceptual decomposition — not a fixed empirical node count.</text><rect x="80" y="250" width="400" height="350" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="280" y="305" class="t l" text-anchor="middle" fill="#315B9A">55 atomic risks</text><text x="280" y="345" class="t s" text-anchor="middle" fill="#667085">Completed conceptual taxonomy</text><rect x="130" y="395" width="300" height="34" rx="17.0" fill="#EEF3F9"/><text x="280.0" y="419.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">financial</text><rect x="130" y="437" width="300" height="34" rx="17.0" fill="#EEF3F9"/><text x="280.0" y="461.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">institutional</text><rect x="130" y="479" width="300" height="34" rx="17.0" fill="#EEF3F9"/><text x="280.0" y="503.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">technical</text><rect x="130" y="521" width="300" height="34" rx="17.0" fill="#EEF3F9"/><text x="280.0" y="545.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">governance</text><rect x="130" y="563" width="300" height="34" rx="17.0" fill="#EEF3F9"/><text x="280.0" y="587.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">DeFi / market</text><line x1="480" y1="425" x2="575" y2="425" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="575" y="215" width="450" height="420" rx="18" fill="#FBFCFE" stroke="#6B65A8" stroke-width="2"/><text x="800" y="270" class="t l" text-anchor="middle" fill="#6B65A8">Measurement screening</text><text x="650" y="335" class="t s" text-anchor="start" fill="#1F2937">✓ economic construct</text><text x="650" y="390" class="t s" text-anchor="start" fill="#1F2937">✓ measurable proxy</text><text x="650" y="445" class="t s" text-anchor="start" fill="#1F2937">✓ data quality</text><text x="650" y="500" class="t s" text-anchor="start" fill="#1F2937">✓ time frequency</text><text x="650" y="555" class="t s" text-anchor="start" fill="#1F2937">✓ comparability</text><line x1="1025" y1="425" x2="1120" y2="425" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1120" y="250" width="400" height="350" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1320" y="305" class="t l" text-anchor="middle" fill="#3A7D78">Empirical risk nodes</text><text x="1320" y="345" class="t s" text-anchor="middle" fill="#667085">Measurable representation</text><text x="1320" y="395" class="t s" text-anchor="middle" fill="#667085">for quantitative analysis</text><rect x="1170" y="475" width="300" height="42" rx="21.0" fill="#EEF6F5"/><text x="1320.0" y="503.0" class="t s" text-anchor="middle" fill="#3A7D78" font-weight="600">node count not fixed</text><rect x="300" y="710" width="1000" height="84" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="760" class="t l" text-anchor="middle" fill="#C97B63">55 ≠ 55 direct model nodes</text></svg>