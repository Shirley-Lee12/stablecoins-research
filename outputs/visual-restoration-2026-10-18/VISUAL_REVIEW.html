riant,img,link] of [['baseline','oldImg','oldLink'],['restored','newImg','newLink']]){const src=`screenshots/${variant}-${p.value}-${w.value}-${m.value}.png`;document.getElementById(img).src=src;document.getElementById(link).href=src;}document.querySelector('#note').textContent=p.value==='agentic'?'旧提交没有Agentic页面：左侧为旧站not-found，仅新版可验收。':'比较布局、字宽、间距与卡片；来源引用和正确研究边界会带来必要的内容高度差异。';document.querySelector('#sections').innerHTML=['hub-work','hub-agenda','hub-team','hub-modules'].map(id=>`<h2>${id}</h2><div class="pair"><img alt="旧版${id}" src="screenshots/baseline-${id}-${w.value}-zh-light.png"><img alt="恢复版${id}" src="screenshots/restored-${id}-${w.value}-zh-light.png"></div>`).join('');}for(const e of[p,w,m])e.addEventListener('change',render);render();</script></html>
