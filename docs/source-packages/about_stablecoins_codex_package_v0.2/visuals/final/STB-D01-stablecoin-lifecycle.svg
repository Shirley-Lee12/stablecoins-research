<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Stablecoin Lifecycle</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.xs{font-size:18px} .s{font-size:20px} .b{font-size:24px} .l{font-size:27px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker>
</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Stablecoin Lifecycle</text><text x="90" y="130" class="m s" text-anchor="start">A shared teaching frame — not every stablecoin uses every step.</text><rect x="45" y="245" width="230" height="330" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="63" y="293" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Economic support</text><text x="73" y="350" class="t xs" text-anchor="start" fill="#1F2937">• reserve</text><text x="73" y="392" class="t xs" text-anchor="start" fill="#1F2937">• collateral</text><text x="73" y="434" class="t xs" text-anchor="start" fill="#1F2937">• hedge</text><text x="73" y="476" class="t xs" text-anchor="start" fill="#1F2937">• mechanism</text><line x1="275" y1="410" x2="303" y2="410" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="303" y="245" width="230" height="330" rx="18" fill="#FFFFFF" stroke="#5F7DB5" stroke-width="2"/><text x="321" y="293" class="t s" text-anchor="start" fill="#5F7DB5" font-weight="600">Mint / issuance</text><text x="331" y="350" class="t xs" text-anchor="start" fill="#1F2937">• issuer or protocol</text><text x="331" y="392" class="t xs" text-anchor="start" fill="#1F2937">• eligibility rules</text><line x1="533" y1="410" x2="561" y2="410" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="561" y="245" width="230" height="330" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="579" y="293" class="t s" text-anchor="start" fill="#3A7D78" font-weight="600">Circulation</text><text x="589" y="350" class="t xs" text-anchor="start" fill="#1F2937">• wallets</text><text x="589" y="392" class="t xs" text-anchor="start" fill="#1F2937">• venues</text><text x="589" y="434" class="t xs" text-anchor="start" fill="#1F2937">• payments / DeFi</text><line x1="791" y1="410" x2="819" y2="410" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="819" y="245" width="230" height="330" rx="18" fill="#FFFFFF" stroke="#C97B63" stroke-width="2"/><text x="837" y="293" class="t s" text-anchor="start" fill="#C97B63" font-weight="600">Price deviation</text><text x="847" y="350" class="t xs" text-anchor="start" fill="#1F2937">• premium or discount</text><text x="847" y="392" class="t xs" text-anchor="start" fill="#1F2937">• liquidity stress</text><line x1="1049" y1="410" x2="1077" y2="410" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1077" y="245" width="230" height="330" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="1095" y="293" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">Stabilisation response</text><text x="1105" y="350" class="t xs" text-anchor="start" fill="#1F2937">• redemption</text><text x="1105" y="392" class="t xs" text-anchor="start" fill="#1F2937">• arbitrage</text><text x="1105" y="434" class="t xs" text-anchor="start" fill="#1F2937">• liquidation</text><text x="1105" y="476" class="t xs" text-anchor="start" fill="#1F2937">• hedge / supply</text><line x1="1307" y1="410" x2="1335" y2="410" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1335" y="245" width="230" height="330" rx="18" fill="#FFFFFF" stroke="#517A63" stroke-width="2"/><text x="1353" y="293" class="t s" text-anchor="start" fill="#517A63" font-weight="600">Burn / settlement</text><text x="1363" y="350" class="t xs" text-anchor="start" fill="#1F2937">• claim reduced</text><text x="1363" y="392" class="t xs" text-anchor="start" fill="#1F2937">• balance restored</text><rect x="310" y="690" width="980" height="86" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="740" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Where is the loss absorbed when the mechanism is stressed?</text></svg>