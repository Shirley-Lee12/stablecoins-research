<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Fiat-reserve-backed Stablecoin Flow</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.xs{font-size:18px} .s{font-size:20px} .b{font-size:24px} .l{font-size:27px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker>
</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Fiat-reserve-backed: Reserve + Redemption + Arbitrage</text><text x="90" y="130" class="m s" text-anchor="start">Direct issuer access and secondary ownership are not the same relationship.</text><rect x="65" y="250" width="270" height="260" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="83" y="298" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Reserve assets</text><text x="83" y="365" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="83" dy="0">cash / T-bills</tspan><tspan x="83" dy="34">custodian / bank</tspan></text><line x1="335" y1="380" x2="370" y2="380" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="370" y="250" width="270" height="260" rx="18" fill="#FFFFFF" stroke="#5F7DB5" stroke-width="2"/><text x="388" y="298" class="t s" text-anchor="start" fill="#5F7DB5" font-weight="600">Issuer</text><text x="388" y="365" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="388" dy="0">mint / burn rules</tspan><tspan x="388" dy="34">legal / compliance</tspan></text><line x1="640" y1="380" x2="675" y2="380" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="675" y="250" width="270" height="260" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="693" y="298" class="t s" text-anchor="start" fill="#3A7D78" font-weight="600">Eligible direct customer</text><text x="693" y="365" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="693" dy="0">institutional / approved</tspan><tspan x="693" dy="34">mint &amp; redeem</tspan></text><line x1="945" y1="380" x2="980" y2="380" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="980" y="250" width="270" height="260" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="998" y="298" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">Stablecoin in circulation</text><text x="998" y="365" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="998" dy="0">wallets / exchanges</tspan><tspan x="998" dy="34">payments / DeFi</tspan></text><line x1="1250" y1="380" x2="1285" y2="380" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1285" y="250" width="270" height="260" rx="18" fill="#FFFFFF" stroke="#C97B63" stroke-width="2"/><text x="1303" y="298" class="t s" text-anchor="start" fill="#C97B63" font-weight="600">Secondary holders</text><text x="1303" y="365" class="t xs" text-anchor="start" fill="#1F2937"><tspan x="1303" dy="0">may not redeem directly</tspan><tspan x="1303" dy="34">market exit may differ</tspan></text><line x1="925" y1="530" x2="640" y2="650" stroke="#3A7D78" stroke-width="4" marker-end="url(#a)" stroke-dasharray="10 8"/><line x1="640" y1="650" x2="335" y2="530" stroke="#3A7D78" stroke-width="4" marker-end="url(#a)" stroke-dasharray="10 8"/><text x="640" y="690" class="t xs" text-anchor="middle" fill="#3A7D78" font-weight="600">eligible redemption / reserve payout / burn</text><rect x="400" y="760" width="800" height="70" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="803" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Reserve backing ≠ identical direct issuer redemption access for every holder.</text></svg>