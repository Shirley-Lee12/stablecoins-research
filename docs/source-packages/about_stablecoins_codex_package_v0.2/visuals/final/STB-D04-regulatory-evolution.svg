<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Stablecoin Regulatory Evolution</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.xs{font-size:18px} .s{font-size:20px} .b{font-size:24px} .l{font-size:27px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker>
</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Stablecoin Regulatory Evolution</text><text x="90" y="130" class="m s" text-anchor="start">From perimeter questions to issuer obligations and system-level monitoring.</text><rect x="50" y="250" width="280" height="330" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="70" y="295" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Risk &amp; perimeter</text><text x="78" y="365" class="t xs" text-anchor="start" fill="#1F2937">• classification</text><text x="78" y="421" class="t xs" text-anchor="start" fill="#1F2937">• AML/CFT</text><text x="78" y="477" class="t xs" text-anchor="start" fill="#1F2937">• consumer / stability risk</text><line x1="330" y1="415" x2="360" y2="415" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="360" y="250" width="280" height="330" rx="18" fill="#FFFFFF" stroke="#5F7DB5" stroke-width="2"/><text x="380" y="295" class="t s" text-anchor="start" fill="#5F7DB5" font-weight="600">Stability obligations</text><text x="388" y="365" class="t xs" text-anchor="start" fill="#1F2937">• reserves</text><text x="388" y="421" class="t xs" text-anchor="start" fill="#1F2937">• redemption</text><text x="388" y="477" class="t xs" text-anchor="start" fill="#1F2937">• governance / resilience</text><line x1="640" y1="415" x2="670" y2="415" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="670" y="250" width="280" height="330" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="690" y="295" class="t s" text-anchor="start" fill="#3A7D78" font-weight="600">International baseline</text><text x="698" y="365" class="t xs" text-anchor="start" fill="#1F2937">• FSB 2023</text><text x="698" y="421" class="t xs" text-anchor="start" fill="#1F2937">• cross-border coordination</text><line x1="950" y1="415" x2="980" y2="415" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="980" y="250" width="280" height="330" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="1000" y="295" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">Dedicated issuer regimes</text><text x="1008" y="365" class="t xs" text-anchor="start" fill="#1F2937">• MiCA 2024</text><text x="1008" y="421" class="t xs" text-anchor="start" fill="#1F2937">• US + HK 2025</text><text x="1008" y="477" class="t xs" text-anchor="start" fill="#1F2937">• UK 2026</text><line x1="1260" y1="415" x2="1290" y2="415" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1290" y="250" width="280" height="330" rx="18" fill="#FFFFFF" stroke="#C97B63" stroke-width="2"/><text x="1310" y="295" class="t s" text-anchor="start" fill="#C97B63" font-weight="600">Systemic &amp; cross-border</text><text x="1318" y="365" class="t xs" text-anchor="start" fill="#1F2937">• implementation gaps</text><text x="1318" y="421" class="t xs" text-anchor="start" fill="#1F2937">• payment-system role</text><text x="1318" y="477" class="t xs" text-anchor="start" fill="#1F2937">• data monitoring</text><rect x="300" y="690" width="1000" height="90" rx="14" fill="#FBFCFE" stroke="#C8D2E1" stroke-width="2"/><text x="800" y="730" class="t s" text-anchor="middle" fill="#667085" font-weight="600">This page explains regulatory evolution, not today&#x27;s country-by-country permission status.</text><text x="800" y="765" class="t s" text-anchor="middle" fill="#1F2937">See /regulatory and /regional-developments for current jurisdiction status.</text></svg>