<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Algorithmic Stablecoin: Intended Loop vs Reflexive Stress Loop</text><text x="90" y="130" class="m s" text-anchor="start">TerraUSD is used here as the historical case for a reflexive endogenous-asset failure mode.</text><text x="110" y="215" class="t l" text-anchor="start" fill="#315B9A">Intended arbitrage loop</text><rect x="85" y="255" width="315" height="112" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="242" y="308" class="t s" text-anchor="middle" fill="#315B9A"><tspan x="242" dy="0">Below peg</tspan></text><line x1="400" y1="311" x2="435" y2="311" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="435" y="255" width="315" height="112" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="592" y="308" class="t s" text-anchor="middle" fill="#3A7D78"><tspan x="592" dy="0">Buy / convert</tspan><tspan x="592" dy="27">stablecoin</tspan></text><line x1="750" y1="311" x2="785" y2="311" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="785" y="255" width="315" height="112" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="942" y="308" class="t s" text-anchor="middle" fill="#6B65A8"><tspan x="942" dy="0">Endogenous token /</tspan><tspan x="942" dy="27">supply adjustment</tspan></text><line x1="1100" y1="311" x2="1135" y2="311" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1135" y="255" width="315" height="112" rx="18" fill="#FFFFFF" stroke="#517A63" stroke-width="2"/><text x="1292" y="308" class="t s" text-anchor="middle" fill="#517A63"><tspan x="1292" dy="0">Intended return</tspan><tspan x="1292" dy="27">toward peg</tspan></text><text x="110" y="455" class="t l" text-anchor="start" fill="#C97B63">Reflexive stress loop</text><rect x="45" y="510" width="270" height="116" rx="18" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="180.0" y="560" class="t xs" text-anchor="middle" fill="#C97B63"><tspan x="180.0" dy="0">Confidence</tspan><tspan x="180.0" dy="23">falls</tspan></text><line x1="315" y1="568" x2="350" y2="568" stroke="#C97B63" stroke-width="4" marker-end="url(#a)"/><rect x="350" y="510" width="270" height="116" rx="18" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="485.0" y="560" class="t xs" text-anchor="middle" fill="#C97B63"><tspan x="485.0" dy="0">Stablecoin</tspan><tspan x="485.0" dy="23">selling rises</tspan></text><line x1="620" y1="568" x2="655" y2="568" stroke="#C97B63" stroke-width="4" marker-end="url(#a)"/><rect x="655" y="510" width="270" height="116" rx="18" fill="#FFF5F5" stroke="#A65A5A" stroke-width="2"/><text x="790.0" y="560" class="t xs" text-anchor="middle" fill="#A65A5A"><tspan x="790.0" dy="0">Endogenous token</tspan><tspan x="790.0" dy="23">issuance rises</tspan></text><line x1="925" y1="568" x2="960" y2="568" stroke="#C97B63" stroke-width="4" marker-end="url(#a)"/><rect x="960" y="510" width="270" height="116" rx="18" fill="#FFF5F5" stroke="#A65A5A" stroke-width="2"/><text x="1095.0" y="560" class="t xs" text-anchor="middle" fill="#A65A5A"><tspan x="1095.0" dy="0">Endogenous token</tspan><tspan x="1095.0" dy="23">price falls</tspan></text><line x1="1230" y1="568" x2="1265" y2="568" stroke="#C97B63" stroke-width="4" marker-end="url(#a)"/><rect x="1265" y="510" width="270" height="116" rx="18" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="1400.0" y="560" class="t xs" text-anchor="middle" fill="#C97B63"><tspan x="1400.0" dy="0">Arbitrage capacity /</tspan><tspan x="1400.0" dy="23">confidence weakens</tspan></text><line x1="1435" y1="626" x2="1435" y2="700" stroke="#C97B63" stroke-width="4" marker-end="url(#a)" stroke-dasharray="10 8"/><line x1="1435" y1="700" x2="180" y2="700" stroke="#C97B63" stroke-width="4" marker-end="url(#a)" stroke-dasharray="10 8"/><line x1="180" y1="700" x2="180" y2="626" stroke="#C97B63" stroke-width="4" marker-end="url(#a)" stroke-dasharray="10 8"/><text x="800" y="765" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">More redemptions / selling can weaken the same asset expected to absorb the stress.</text></svg>