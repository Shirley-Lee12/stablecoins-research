<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Crypto-collateralised Stablecoin Flow</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.xs{font-size:18px} .s{font-size:20px} .b{font-size:24px} .l{font-size:27px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker>
</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Crypto-collateralised: Overcollateralisation + Liquidation</text><text x="90" y="130" class="m s" text-anchor="start">The peg and solvency depend on collateral value, liquidation execution and redemption/arbitrage.</text><rect x="100" y="245" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="250" y="300" class="t l" text-anchor="middle" fill="#315B9A">Crypto collateral</text><text x="250" y="338" class="t xs" text-anchor="middle" fill="#667085">WETH / wstETH / rETH etc.</text><line x1="400" y1="310" x2="480" y2="310" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="480" y="245" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="630" y="300" class="t l" text-anchor="middle" fill="#3A7D78">Borrowing position</text><text x="630" y="338" class="t xs" text-anchor="middle" fill="#667085">debt + collateral ratio</text><line x1="780" y1="310" x2="860" y2="310" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="860" y="245" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="1010" y="300" class="t l" text-anchor="middle" fill="#6B65A8">Stablecoin minted</text><text x="1010" y="338" class="t xs" text-anchor="middle" fill="#667085">circulates / used elsewhere</text><line x1="630" y1="375" x2="630" y2="485" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="390" y="485" width="480" height="120" rx="18" fill="#F5FAF7" stroke="#517A63" stroke-width="2"/><text x="630" y="530" class="t s" text-anchor="middle" fill="#517A63" font-weight="600">SAFE</text><text x="630" y="565" class="t s" text-anchor="middle" fill="#1F2937">collateral ratio remains sufficient</text><line x1="1010" y1="375" x2="1010" y2="485" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="900" y="485" width="480" height="120" rx="18" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="1140" y="530" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">UNSAFE</text><text x="1140" y="565" class="t s" text-anchor="middle" fill="#1F2937">liquidation → debt reduction / collateral sale</text><rect x="155" y="705" width="300" height="44" rx="22.0" fill="#EEF3F9"/><text x="305.0" y="733.0" class="t xs" text-anchor="middle" fill="#315B9A" font-weight="600">oracle</text><rect x="500" y="705" width="300" height="44" rx="22.0" fill="#EEF3F9"/><text x="650.0" y="733.0" class="t xs" text-anchor="middle" fill="#315B9A" font-weight="600">chain congestion</text><rect x="845" y="705" width="300" height="44" rx="22.0" fill="#EEF3F9"/><text x="995.0" y="733.0" class="t xs" text-anchor="middle" fill="#315B9A" font-weight="600">collateral liquidity</text><rect x="1190" y="705" width="255" height="44" rx="22.0" fill="#EEF3F9"/><text x="1317.5" y="733.0" class="t xs" text-anchor="middle" fill="#315B9A" font-weight="600">bad debt</text><text x="800" y="815" class="t s" text-anchor="middle" fill="#667085" font-weight="600">Peg support may also use redemption and secondary-market arbitrage.</text></svg>