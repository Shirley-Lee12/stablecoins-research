<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Stablecoin vs Adjacent Digital Money</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.xs{font-size:18px} .s{font-size:20px} .b{font-size:24px} .l{font-size:27px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker>
</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Stablecoin vs Adjacent Digital Money</text><text x="90" y="130" class="m s" text-anchor="start">Digital form does not make these instruments economically identical.</text><rect x="65" y="220" width="345" height="470" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="93" y="270" class="t l" text-anchor="start" fill="#315B9A">Stablecoin</text><text x="99" y="340" class="t s" text-anchor="start" fill="#1F2937">• Private issuer / protocol</text><text x="99" y="405" class="t s" text-anchor="start" fill="#1F2937">• Reference-value target</text><text x="99" y="470" class="t s" text-anchor="start" fill="#1F2937">• Redemption varies by design</text><text x="99" y="535" class="t s" text-anchor="start" fill="#1F2937">• Reserve/collateral/hedge</text><rect x="445" y="220" width="345" height="470" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="473" y="270" class="t l" text-anchor="start" fill="#6B65A8">CBDC</text><text x="479" y="340" class="t s" text-anchor="start" fill="#1F2937">• Central-bank liability</text><text x="479" y="405" class="t s" text-anchor="start" fill="#1F2937">• Sovereign money</text><text x="479" y="470" class="t s" text-anchor="start" fill="#1F2937">• Rules set by central bank</text><text x="479" y="535" class="t s" text-anchor="start" fill="#1F2937">• Not a stablecoin</text><rect x="825" y="220" width="345" height="470" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="853" y="270" class="t l" text-anchor="start" fill="#3A7D78">Tokenised deposit</text><text x="859" y="340" class="t s" text-anchor="start" fill="#1F2937">• Commercial-bank liability</text><text x="859" y="405" class="t s" text-anchor="start" fill="#1F2937">• Deposit claim</text><text x="859" y="470" class="t s" text-anchor="start" fill="#1F2937">• Bank redemption/payment rules</text><text x="859" y="535" class="t s" text-anchor="start" fill="#1F2937">• Tokenised representation</text><rect x="1205" y="220" width="345" height="470" rx="18" fill="#FFFFFF" stroke="#517A63" stroke-width="2"/><text x="1233" y="270" class="t l" text-anchor="start" fill="#517A63">Tokenised fund share</text><text x="1239" y="340" class="t s" text-anchor="start" fill="#1F2937">• Fund / security claim</text><text x="1239" y="405" class="t s" text-anchor="start" fill="#1F2937">• Portfolio-backed</text><text x="1239" y="470" class="t s" text-anchor="start" fill="#1F2937">• Fund dealing / market exit</text><text x="1239" y="535" class="t s" text-anchor="start" fill="#1F2937">• Not money by definition</text><rect x="445" y="755" width="710" height="52" rx="26.0" fill="#EEF3F9"/><text x="800.0" y="787.0" class="t xs" text-anchor="middle" fill="#1F2937" font-weight="600">Compare issuer/obligor · legal claim · redemption · backing · transfer rail</text></svg>