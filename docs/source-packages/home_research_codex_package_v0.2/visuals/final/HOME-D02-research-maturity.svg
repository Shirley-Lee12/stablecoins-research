<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Research Maturity</text><text x="90" y="130" class="m s" text-anchor="start">Completed outputs, interim results, validation and future plans must remain visibly distinct.</text><rect x="60" y="205" width="355" height="500" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="88" y="260" class="t l" text-anchor="start" fill="#315B9A">Completed / Public</text><text x="98" y="325" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="122" y="325" class="t s" text-anchor="start" fill="#1F2937"><tspan x="122" dy="0">55-risk conceptual framework</tspan></text><text x="98" y="387" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="122" y="387" class="t s" text-anchor="start" fill="#1F2937"><tspan x="122" dy="0">AI-DEFIT 2026 paper</tspan></text><text x="98" y="449" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="122" y="449" class="t s" text-anchor="start" fill="#1F2937"><tspan x="122" dy="0">Asia Stablecoin Development</tspan></text><text x="98" y="511" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="122" y="511" class="t s" text-anchor="start" fill="#1F2937"><tspan x="122" dy="0">Agentic Payments</tspan></text><rect x="450" y="205" width="355" height="500" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="478" y="260" class="t l" text-anchor="start" fill="#6B65A8">Interim empirical results</text><text x="488" y="325" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="512" y="325" class="t s" text-anchor="start" fill="#1F2937"><tspan x="512" dy="0">Measurable risk nodes</tspan></text><text x="488" y="387" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="512" y="387" class="t s" text-anchor="start" fill="#1F2937"><tspan x="512" dy="0">Transfer Entropy</tspan></text><text x="488" y="449" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="512" y="449" class="t s" text-anchor="start" fill="#1F2937"><tspan x="512" dy="0">Multivariate Hawkes</tspan></text><text x="488" y="511" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="512" y="511" class="t s" text-anchor="start" fill="#1F2937"><tspan x="512" dy="0">Stress / case result packages</tspan></text><rect x="840" y="205" width="355" height="500" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="868" y="260" class="t l" text-anchor="start" fill="#3A7D78">Validation in progress</text><text x="878" y="325" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="902" y="325" class="t s" text-anchor="start" fill="#1F2937"><tspan x="902" dy="0">Robustness</tspan></text><text x="878" y="387" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="902" y="387" class="t s" text-anchor="start" fill="#1F2937"><tspan x="902" dy="0">Reproducibility</tspan></text><text x="878" y="449" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="902" y="449" class="t s" text-anchor="start" fill="#1F2937"><tspan x="902" dy="0">Out-of-sample evaluation</tspan></text><text x="878" y="511" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="902" y="511" class="t s" text-anchor="start" fill="#1F2937"><tspan x="902" dy="0">Event interpretation</tspan></text><rect x="1230" y="205" width="355" height="500" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1258" y="260" class="t l" text-anchor="start" fill="#94A3B8">Planned</text><text x="1268" y="325" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="1292" y="325" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1292" dy="0">Continuous monitoring</tspan></text><text x="1268" y="387" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="1292" y="387" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1292" dy="0">Interpretable warnings</tspan></text><text x="1268" y="449" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="1292" y="449" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1292" dy="0">Integrated research +</tspan><tspan x="1292" dy="25">market data</tspan></text><rect x="310" y="760" width="980" height="72" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="805" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">No live depeg probability or production-grade early-warning score.</text></svg>