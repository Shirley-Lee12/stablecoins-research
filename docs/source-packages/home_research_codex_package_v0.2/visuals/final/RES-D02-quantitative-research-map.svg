<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Quantitative Research Map</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.s{font-size:20px} .b{font-size:24px} .l{font-size:26px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Quantitative Risk-Transmission Research</text><text x="90" y="130" class="m s" text-anchor="start">Continuous risk states and extreme events are analysed through complementary models.</text><text x="120" y="210" class="t l" text-anchor="start" fill="#315B9A">Continuous risk states</text><rect x="100" y="260" width="600" height="90" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="400" y="315" class="t s" text-anchor="middle" fill="#315B9A" font-weight="600">Measured risk indicators / nodes</text><line x1="400" y1="350" x2="400" y2="385" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="100" y="385" width="600" height="90" rx="18" fill="#FFFFFF" stroke="#5F7DB5" stroke-width="2"/><text x="400" y="440" class="t s" text-anchor="middle" fill="#5F7DB5" font-weight="600">Rolling windows</text><line x1="400" y1="475" x2="400" y2="510" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="100" y="510" width="600" height="90" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="400" y="565" class="t s" text-anchor="middle" fill="#6B65A8" font-weight="600">Transfer Entropy</text><line x1="400" y1="600" x2="400" y2="635" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="100" y="635" width="600" height="90" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="400" y="690" class="t s" text-anchor="middle" fill="#3A7D78" font-weight="600">Directed, time-varying transmission network</text><text x="900" y="210" class="t l" text-anchor="start" fill="#6B65A8">Extreme events</text><rect x="880" y="260" width="600" height="90" rx="18" fill="#FFFFFF" stroke="#5F7DB5" stroke-width="2"/><text x="1180" y="315" class="t s" text-anchor="middle" fill="#5F7DB5" font-weight="600">Threshold / event construction</text><line x1="1180" y1="350" x2="1180" y2="385" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="880" y="385" width="600" height="90" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="1180" y="440" class="t s" text-anchor="middle" fill="#6B65A8" font-weight="600">Multivariate Hawkes</text><line x1="1180" y1="475" x2="1180" y2="510" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="880" y="510" width="600" height="90" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1180" y="565" class="t s" text-anchor="middle" fill="#3A7D78" font-weight="600">Self-excitation / cross-excitation</text><rect x="230" y="690" width="1140" height="95" rx="16" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="730" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Validation layer</text><text x="800" y="765" class="t s" text-anchor="middle" fill="#1F2937">Historical cases · stress scenarios · robustness · out-of-sample · reproducibility</text><line x1="800" y1="785" x2="800" y2="830" stroke="#94A3B8" stroke-width="4" marker-end="url(#a)" stroke-dasharray="10 8"/><rect x="575" y="835" width="450" height="42" rx="21.0" fill="#EEF2F7"/><text x="800.0" y="863.0" class="t s" text-anchor="middle" fill="#94A3B8" font-weight="600">Future: monitoring / interpretable warnings</text></svg>