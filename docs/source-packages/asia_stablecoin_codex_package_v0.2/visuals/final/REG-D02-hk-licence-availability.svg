<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Hong Kong: Licence ≠ Availability</text><text x="90" y="130" class="m s" text-anchor="start">A licence is the first gate. Token launch, distribution and user eligibility are separate.</text><text x="90" y="227" class="t l" text-anchor="start" fill="#315B9A">Anchorpoint / HKDAP</text><rect x="90" y="260" width="220" height="150" rx="14" fill="#EEF4FA" stroke="#315B9A" stroke-width="2"/><text x="108" y="297" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Licence</text><text x="108" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="108" dy="0">FRS01</tspan><tspan x="108" dy="27">10 Apr 2026</tspan></text><line x1="310" y1="335" x2="335" y2="335" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="335" y="260" width="220" height="150" rx="14" fill="#EEF4FA" stroke="#315B9A" stroke-width="2"/><text x="353" y="297" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Token</text><text x="353" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="353" dy="0">HKDAP</tspan></text><line x1="555" y1="335" x2="580" y2="335" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="580" y="260" width="220" height="150" rx="14" fill="#EEF4FA" stroke="#315B9A" stroke-width="2"/><text x="598" y="297" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Access</text><text x="598" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="598" dy="0">Beta live</tspan><tspan x="598" dy="27">12 Aug</tspan></text><line x1="800" y1="335" x2="825" y2="335" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="825" y="260" width="220" height="150" rx="14" fill="#EEF4FA" stroke="#315B9A" stroke-width="2"/><text x="843" y="297" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Distribution</text><text x="843" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="843" dy="0">Authorised</tspan><tspan x="843" dy="27">distributors</tspan></text><line x1="1045" y1="335" x2="1070" y2="335" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1070" y="260" width="220" height="150" rx="14" fill="#EEF4FA" stroke="#315B9A" stroke-width="2"/><text x="1088" y="297" class="t s" text-anchor="start" fill="#315B9A" font-weight="600">Users</text><text x="1088" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1088" dy="0">Institutional</tspan><tspan x="1088" dy="27">/ corporate</tspan></text><line x1="1290" y1="335" x2="1315" y2="335" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1315" y="260" width="220" height="150" rx="14" fill="#F3F4F6" stroke="#94A3B8" stroke-width="2"/><text x="1333" y="297" class="t s" text-anchor="start" fill="#94A3B8" font-weight="600">Retail</text><text x="1333" y="335" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1333" dy="0">Full Launch</tspan><tspan x="1333" dy="27">target</tspan></text><text x="90" y="532" class="t l" text-anchor="start" fill="#6B65A8">HSBC / RedCoin</text><rect x="90" y="565" width="220" height="150" rx="14" fill="#EEF4FA" stroke="#6B65A8" stroke-width="2"/><text x="108" y="602" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">Licence</text><text x="108" y="640" class="t s" text-anchor="start" fill="#1F2937"><tspan x="108" dy="0">FRS02</tspan><tspan x="108" dy="27">10 Apr 2026</tspan></text><line x1="310" y1="640" x2="335" y2="640" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="335" y="565" width="220" height="150" rx="14" fill="#EEF4FA" stroke="#6B65A8" stroke-width="2"/><text x="353" y="602" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">Product</text><text x="353" y="640" class="t s" text-anchor="start" fill="#1F2937"><tspan x="353" dy="0">RedCoin</tspan><tspan x="353" dy="27">named</tspan></text><line x1="555" y1="640" x2="580" y2="640" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="580" y="565" width="220" height="150" rx="14" fill="#F3F4F6" stroke="#94A3B8" stroke-width="2"/><text x="598" y="602" class="t s" text-anchor="start" fill="#94A3B8" font-weight="600">Channel</text><text x="598" y="640" class="t s" text-anchor="start" fill="#1F2937"><tspan x="598" dy="0">PayMe / HSBC</tspan><tspan x="598" dy="27">App planned</tspan></text><line x1="800" y1="640" x2="825" y2="640" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="825" y="565" width="220" height="150" rx="14" fill="#F3F4F6" stroke="#94A3B8" stroke-width="2"/><text x="843" y="602" class="t s" text-anchor="start" fill="#94A3B8" font-weight="600">Token</text><text x="843" y="640" class="t s" text-anchor="start" fill="#1F2937"><tspan x="843" dy="0">Not yet issued</tspan><tspan x="843" dy="27">30 Sep</tspan></text><line x1="1045" y1="640" x2="1070" y2="640" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1070" y="565" width="220" height="150" rx="14" fill="#F3F4F6" stroke="#94A3B8" stroke-width="2"/><text x="1088" y="602" class="t s" text-anchor="start" fill="#94A3B8" font-weight="600">Users</text><text x="1088" y="640" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1088" dy="0">Not yet</tspan><tspan x="1088" dy="27">available</tspan></text><line x1="1290" y1="640" x2="1315" y2="640" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1315" y="565" width="220" height="150" rx="14" fill="#F3F4F6" stroke="#94A3B8" stroke-width="2"/><text x="1333" y="602" class="t s" text-anchor="start" fill="#94A3B8" font-weight="600">Retail</text><text x="1333" y="640" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1333" dy="0">Launch</tspan><tspan x="1333" dy="27">forthcoming</tspan></text><rect x="465" y="825" width="670" height="48" rx="24.0" fill="#EEF3F9"/><text x="800.0" y="856.0" class="t s" text-ancho