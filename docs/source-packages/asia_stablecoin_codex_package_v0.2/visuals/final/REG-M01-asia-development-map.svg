</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Asia Stablecoin Development</text><text x="90" y="130" class="m s" text-anchor="start">Four jurisdictions, four different policy and product paths — not an openness ranking.</text><rect x="90" y="220" width="675" height="220" rx="18" fill="#FFFFFF" stroke="#A65A5A" stroke-width="2"/><rect x="90" y="220" width="14" height="220" rx="7" fill="#A65A5A"/><text x="130" y="270" class="t l" text-anchor="start" fill="#A65A5A">Mainland China</text><text x="130" y="320" class="t s" text-anchor="start" fill="#1F2937">Private stablecoin: restricted</text><text x="130" y="360" class="t s" text-anchor="start" fill="#1F2937">Digital-money route: e-CNY</text><text x="130" y="400" class="m s" text-anchor="start">No public private stablecoin issuer market</text><rect x="835" y="220" width="675" height="220" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><rect x="835" y="220" width="14" height="220" rx="7" fill="#315B9A"/><text x="875" y="270" class="t l" text-anchor="start" fill="#315B9A">Hong Kong</text><text x="875" y="320" class="t s" text-anchor="start" fill="#1F2937">Dedicated issuer regime: live</text><text x="875" y="360" class="t s" text-anchor="start" fill="#1F2937">2 licensed issuers</text><text x="875" y="400" class="m s" text-anchor="start">HKDAP beta live · RedCoin forthcoming</text><rect x="90" y="520" width="675" height="220" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><rect x="90" y="520" width="14" height="220" rx="7" fill="#6B65A8"/><text x="130" y="570" class="t l" text-anchor="start" fill="#6B65A8">Singapore</text><text x="130" y="620" class="t s" text-anchor="start" fill="#1F2937">Framework design: finalised</text><text x="130" y="660" class="t s" text-anchor="start" fill="#1F2937">Implementation: consultation</text><text x="130" y="700" class="m s" text-anchor="start">XSGD / XUSD live under PSA/DPT</text><rect x="835" y="520" width="675" height="220" rx="18" fill=