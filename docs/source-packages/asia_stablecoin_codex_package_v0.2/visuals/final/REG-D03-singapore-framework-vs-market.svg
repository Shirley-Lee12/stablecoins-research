</defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Singapore: Framework vs Live Market</text><text x="90" y="130" class="m s" text-anchor="start">Policy design and existing product activity are moving on parallel tracks.</text><text x="100" y="220" class="t l" text-anchor="start" fill="#6B65A8">Track A · Dedicated MAS-SCS regime</text><rect x="120" y="270" width="380" height="120" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="145" y="305" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">2023</text><text x="145" y="350" class="t s" text-anchor="start" fill="#1F2937">Framework design finalised</text><line x1="500" y1="330" x2="550" y2="330" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="550" y="270" width="380" height="120" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="575" y="305" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">2026</text><text x="575" y="350" class="t s" text-anchor="start" fill="#1F2937">PS Act amendments consultation</text><line x1="930" y1="330" x2="980" y2="330" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="980" y="270" width="380" height="120" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="1005" y="305" class="t s" text-anchor="start" fill="#6B65A8" font-weight="600">Future</text><text x="1005" y="350" class="t s" text-anchor="start" fill="#1F2937">MAS-SCS issuer/token label</text><text x="100" y="500" class="t l" text-anchor="start" fill="#3A7D78">Track B · Existing PSA / DPT market</text><rect x="120" y="550" width="380" height="120" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="145" y="585" class="t s" text-anchor="start" fill="#3A7D78" font-weight="600">PSA</text><text x="145" y="630" class="t s" text-anchor="start" fill="#1F2937">Current legal framework</text><line x1="500" y1="610" x2="550" y2="610" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="550" y="550" width="380" height="120" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="575" y="585" class="t s" text-anchor="start" fill="#3A7D78" font-weight="600">MPI / DPT</text><text x="575" y="630" class="t s" text-anchor="start" fill="#1F2937">Regulated providers</text><line x1="930" y1="610" x2="980" y2="610" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="980" y="550" width="380" height="120" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1005" y="585" class="t s" text-anchor="start" fill="#3A7D78" font-weight="600">Live products</text><text x="1005" y="630" class="t s" text-anchor="start" fill="#1F2937">XSGD · XUSD · Circle services</text><rect x="250" y="760" width="1100" height="72" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="805" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Existing regulated DPT activity ≠ future MAS-SCS issuer licence</text></svg>