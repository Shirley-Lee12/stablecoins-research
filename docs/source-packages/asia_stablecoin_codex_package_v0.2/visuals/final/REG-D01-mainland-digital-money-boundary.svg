<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Mainland Digital Money Boundary</title><rect width="100%" height="100%" fill="#F7F9FC"/>
<style>
.t{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1F2937}
.m{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#667085}
.s{font-size:20px} .b{font-size:24px} .l{font-size:26px;font-weight:600} .ttl{font-size:44px;font-weight:700}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/></marker></defs><text x="90" y="90" class="t ttl" text-anchor="start" fill="#1F2937">Mainland China: Digital-Money Boundary</text><text x="90" y="130" class="m s" text-anchor="start">Private stablecoin, e-CNY and approved tokenisation are legally different paths.</text><rect x="70" y="205" width="475" height="500" rx="18" fill="#FFFFFF" stroke="#A65A5A" stroke-width="2"/><text x="105" y="260" class="t l" text-anchor="start" fill="#A65A5A">Private stablecoin / virtual currency</text><text x="115" y="330" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="142" y="330" class="t s" text-anchor="start" fill="#1F2937"><tspan x="142" dy="0">Private issuance / trading</tspan></text><text x="115" y="388" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="142" y="388" class="t s" text-anchor="start" fill="#1F2937"><tspan x="142" dy="0">Offshore RMB-linked stablecoin</tspan></text><text x="115" y="446" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="142" y="446" class="t s" text-anchor="start" fill="#1F2937"><tspan x="142" dy="0">Offshore issuance by Mainland-</tspan><tspan x="142" dy="28">controlled entities</tspan></text><rect x="105" y="620" width="405" height="48" rx="24.0" fill="#F1F4F8"/><text x="307.5" y="651.0" class="t s" text-anchor="middle" fill="#A65A5A" font-weight="600">PROHIBITED / RESTRICTED</text><rect x="585" y="205" width="475" height="500" rx="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="620" y="260" class="t l" text-anchor="start" fill="#315B9A">e-CNY / CBDC</text><text x="630" y="330" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="657" y="330" class="t s" text-anchor="start" fill="#1F2937"><tspan x="657" dy="0">Issued by PBOC</tspan></text><text x="630" y="388" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="657" y="388" class="t s" text-anchor="start" fill="#1F2937"><tspan x="657" dy="0">Legal tender / sovereign money</tspan></text><text x="630" y="446" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="657" y="446" class="t s" text-anchor="start" fill="#1F2937"><tspan x="657" dy="0">Cross-boundary retail pilots</tspan></text><rect x="620" y="620" width="405" height="48" rx="24.0" fill="#F1F4F8"/><text x="822.5" y="651.0" class="t s" text-anchor="middle" fill="#315B9A" font-weight="600">OFFICIAL DIGITAL MONEY ROUTE</text><rect x="1100" y="205" width="475" height="500" rx="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1135" y="260" class="t l" text-anchor="start" fill="#3A7D78">Approved tokenised activity</text><text x="1145" y="330" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="1172" y="330" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1172" dy="0">RWA tokenisation generally restricted</tspan></text><text x="1145" y="388" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="1172" y="388" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1172" dy="0">Exceptions require approval</tspan></text><text x="1145" y="446" class="t s" text-anchor="start" fill="#1F2937">•</text><text x="1172" y="446" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1172" dy="0">Specific financial infrastructure</tspan></text><rect x="1135" y="620" width="405" height="48" rx="24.0" fill="#F1F4F8"/><text x="1337.5" y="651.0" class="t s" text-anchor="middle" fill="#3A7D78" font-weight="600">APPROVAL-BOUND</text><rect x="200" y="760" width="1200" height="72" rx="14" fill="#FFF9F4" stroke="#C97B63" stroke-width="2"/><text x="800" y="805" class="t s" text-anchor="middle" fill="#C97B63" font-weight="600">Hong Kong stablecoin licence does not create Mainland distribution permission.</text></svg>