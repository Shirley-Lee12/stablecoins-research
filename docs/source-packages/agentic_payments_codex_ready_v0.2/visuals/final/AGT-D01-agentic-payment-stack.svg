<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Agentic Payment Stack</title>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <style>
    .t { font-family: Inter, "Noto Sans SC", "PingFang SC", Arial, sans-serif; fill:#1F2937; }
    .muted { font-family: Inter, "Noto Sans SC", "PingFang SC", Arial, sans-serif; fill:#667085; }
    .small { font-size:22px; }
    .body { font-size:26px; }
    .label { font-size:24px; font-weight:600; }
    .title { font-size:44px; font-weight:700; }
    .sub { font-size:24px; }
    .box { fill:#FFFFFF; stroke:#C8D2E1; stroke-width:2; rx:18; ry:18; }
    .arrow { stroke:#C8D2E1; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .dash { stroke-dasharray:10 8; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/>
    </marker>
  </defs>
<text x="90" y="90" class="t title" text-anchor="start">Agentic Payment Stack</text><text x="90" y="130" class="muted small" text-anchor="start">From user intent to payment, settlement and evidence</text><rect x="120" y="200" width="1360" height="110" rx="18" ry="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><rect x="120" y="200" width="20" height="110" rx="10" fill="#315B9A"/><text x="170" y="242" class="t label" text-anchor="start" fill="#315B9A">1  User Intent</text><text x="170" y="278" class="muted small" text-anchor="start">What does the user actually want?</text><text x="1440" y="267" class="t small" text-anchor="end">“Buy a Friday flight under ¥500”</text><line x1="800" y1="310" x2="800" y2="335" stroke="#C8D2E1" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="335" width="1360" height="110" rx="18" ry="18" fill="#FFFFFF" stroke="#5F7DB5" stroke-width="2"/><rect x="120" y="335" width="20" height="110" rx="10" fill="#5F7DB5"/><text x="170" y="377" class="t label" text-anchor="start" fill="#5F7DB5">2  AI Agent</text><text x="170" y="413" class="muted small" text-anchor="start">Who is acting?</text><text x="1440" y="402" class="t small" text-anchor="end">ChatGPT · Gemini · Muse · Grok Bot · JD AI Shopping</text><line x1="800" y1="445" x2="800" y2="470" stroke="#C8D2E1" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="470" width="1360" height="110" rx="18" ry="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><rect x="120" y="470" width="20" height="110" rx="10" fill="#6B65A8"/><text x="170" y="512" class="t label" text-anchor="start" fill="#6B65A8">3  Trust &amp; Authorization</text><text x="170" y="548" class="muted small" text-anchor="start">What is the agent allowed to do?</text><text x="1440" y="537" class="t small" text-anchor="end">AP2 · ACT · AMP · APOP · KYA</text><line x1="800" y1="580" x2="800" y2="605" stroke="#C8D2E1" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="605" width="1360" height="110" rx="18" ry="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><rect x="120" y="605" width="20" height="110" rx="10" fill="#3A7D78"/><text x="170" y="647" class="t label" text-anchor="start" fill="#3A7D78">4  Payment Execution</text><text x="170" y="683" class="muted small" text-anchor="start">How is payment initiated?</text><text x="1440" y="672" class="t small" text-anchor="end">x402 · MPP · A402 · Agent Pay · JD AI Pay</text><line x1="800" y1="715" x2="800" y2="740" stroke="#C8D2E1" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="740" width="1360" height="110" rx="18" ry="18" fill="#FFFFFF" stroke="#517A63" stroke-width="2"/><rect x="120" y="740" width="20" height="110" rx="10" fill="#517A63"/><text x="170" y="782" class="t label" text-anchor="start" fill="#517A63">5  Rail &amp; Settlement</text><text x="170" y="818" class="muted small" text-anchor="start">Where does value move?</text><text x="1440" y="807" class="t small" text-anchor="end">Card · Bank · Wallet · Stablecoin · Blockchain</text><rect x="1180" y="820" width="300" height="48" rx="24.0" fill="#EEF2F7"/><text x="1330.0" y="852.0" class="t small" text-anchor="middle" fill="#1F2937" font-weight="600">Receipt · Audit · Dispute</text></svg>