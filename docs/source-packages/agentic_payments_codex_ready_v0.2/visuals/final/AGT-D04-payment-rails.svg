<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Three Payment Rails</title>
  <rect width="100%" height="100%" fill="#F7F9FC"/>
  <style>
    .t { font-family: Inter, "Noto Sans SC", "PingFang SC", Arial, sans-serif; fill:#1F2937; }
    .muted { font-family: Inter, "Noto Sans SC", "PingFang SC", Arial, sans-serif; fill:#667085; }
    .small { font-size:22px; }
    .body { font-size:26px; }
    .label { font-size:24px; font-weight:600; }
    .title { font-size:44px; font-weight:700; }
    .sub { font-size:24px; }
    .box { fill:#FFFFFF; stroke:#C8D2E1; stroke-width:2; rx:18; ry:18; }
    .arrow { stroke:#C8D2E1; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .dash { stroke-dasharray:10 8; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C8D2E1"/>
    </marker>
  </defs>
<text x="90" y="90" class="t title" text-anchor="start">The Agent Can Pay Through Different Rails</text><text x="90" y="130" class="muted small" text-anchor="start">Stablecoin is one payment rail — not the whole agentic-payment stack.</text><rect x="75" y="185" width="470" height="590" rx="18" ry="18" fill="#FFFFFF" stroke="#315B9A" stroke-width="2"/><text x="110" y="245" class="t label" text-anchor="start" fill="#315B9A">Card / Bank</text><text x="110" y="287" class="muted small" text-anchor="start">Visa · Mastercard · UnionPay · ACH · UPI</text><text x="110" y="345" class="t small" text-anchor="start" fill="#517A63" font-weight="600">Strengths</text><text x="125" y="388" class="t small" text-anchor="start">• Merchant acceptance</text><text x="125" y="430" class="t small" text-anchor="start">• Refund / dispute maturity</text><text x="125" y="472" class="t small" text-anchor="start">• Consumer protection</text><text x="110" y="532" class="t small" text-anchor="start" fill="#C97B63" font-weight="600">Trade-offs</text><text x="125" y="574" class="t small" text-anchor="start">• Micropayment economics</text><text x="125" y="616" class="t small" text-anchor="start">• Machine-native interaction</text><rect x="590" y="185" width="470" height="590" rx="18" ry="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="625" y="245" class="t label" text-anchor="start" fill="#6B65A8">Wallet / APM</text><text x="625" y="287" class="muted small" text-anchor="start">Alipay · Alipay+ · GCash · DANA · TNG</text><text x="625" y="345" class="t small" text-anchor="start" fill="#517A63" font-weight="600">Strengths</text><text x="640" y="388" class="t small" text-anchor="start">• Mobile-first</text><text x="640" y="430" class="t small" text-anchor="start">• Regional coverage</text><text x="640" y="472" class="t small" text-anchor="start">• Existing wallet identity</text><text x="625" y="532" class="t small" text-anchor="start" fill="#C97B63" font-weight="600">Trade-offs</text><text x="640" y="574" class="t small" text-anchor="start">• Cross-wallet interoperability</text><text x="640" y="616" class="t small" text-anchor="start">• Platform dependence</text><rect x="1105" y="185" width="470" height="590" rx="18" ry="18" fill="#FFFFFF" stroke="#3A7D78" stroke-width="2"/><text x="1140" y="245" class="t label" text-anchor="start" fill="#3A7D78">Stablecoin / Blockchain</text><text x="1140" y="287" class="muted small" text-anchor="start">x402 paths · MPP stablecoin rail · A2A</text><text x="1140" y="345" class="t small" text-anchor="start" fill="#517A63" font-weight="600">Strengths</text><text x="1155" y="388" class="t small" text-anchor="start">• 24/7</text><text x="1155" y="430" class="t small" text-anchor="start">• Micropayments</text><text x="1155" y="472" class="t small" text-anchor="start">• Programmability</text><text x="1155" y="514" class="t small" text-anchor="start">• Cross-border</text><text x="1140" y="574" class="t small" text-anchor="start" fill="#C97B63" font-weight="600">Trade-offs</text><text x="1155" y="616" class="t small" text-anchor="start">• Key / wallet risk</text><text x="1155" y="658" class="t small" text-anchor="start">• Irreversibility</text><text x="1155" y="700" class="t small" text-anchor="start">• Regulatory variance</text><rect x="495" y="815" width="610" height="52" rx="26.0" fill="#EEF3F9"/><text x="800.0" y="849.0" class="t small" text-anchor="middle" fill="#1F2937" font-weight="600">Agentic commerce can route across all three.</text></svg>