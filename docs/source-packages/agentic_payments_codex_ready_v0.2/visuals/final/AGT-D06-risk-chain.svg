="1390" y1="415" x2="1405" y2="415" stroke="#C8D2E1" stroke-width="4" marker-end="url(#a)"/><rect x="1405" y="225" width="180" height="395" rx="18" fill="#FFFFFF" stroke="#6B65A8" stroke-width="2"/><text x="1495.0" y="270" class="t l" text-anchor="middle" fill="#6B65A8">Dispute</text><text x="1423" y="313" class="m s" text-anchor="start">Risk</text><text x="1423" y="350" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1423" dy="0">Weak evidence</tspan><tspan x="1423" dy="28">Unclear liability</tspan></text><line x1="1421" y1="455" x2="1569" y2="455" stroke="#C8D2E1" stroke-width="2"/><text x="1423" y="495" class="m s" text-anchor="start">Control</text><text x="1423" y="530" class="t s" text-anchor="start" fill="#1F2937"><tspan x="1423" dy="0">Receipt</tspan><tspan x="1423" dy="28">Audit trail</tspan></text><rect x="400" y="690" width="800" height="52" rx="26.0" fill="#EEF3F9"/><text x="800.0" y="723.0" class="t s" text-anchor="middle" fill="#1F2937" font-weight="600">More autonomy → stronger identity, limits, monitoring and evidence</text></svg>