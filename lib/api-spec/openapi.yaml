openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Stablecoin Research Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: resources
    description: Academic and industry resource management
  - name: research
    description: Our research papers
  - name: regulatory
    description: Regulatory timeline entries
  - name: tags
    description: Resource tags
  - name: stats
    description: Summary statistics
  - name: subscriptions
    description: Admin-managed literature discovery subscriptions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List resources with optional filters
      parameters:
        - name: resource_type
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/recent:
    get:
      operationId: listRecentResources
      tags: [resources]
      summary: Get recently added resources
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/extract:
    post:
      operationId: extractResource
      tags: [resources]
      summary: Extract metadata from URL, DOI, or PDF text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionInput"
      responses:
        "200":
          description: Extracted metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceUpdate"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Delete a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/resources/pre-review:
    post:
      operationId: queueResourceAiPreReview
      tags: [resources]
      summary: Queue public-link and AI pre-review for pending resources
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPreReviewInput"
      responses:
        "202":
          description: Reviews queued

  /admin/resources/apply-latest-rules:
    post:
      operationId: applyLatestRulesToPendingResources
      tags: [resources]
      summary: Re-run current classification, tagging, and AI pre-review rules for selected pending resources
      description: Preserves manually entered fields and manual tag links while replacing auto-generated tag links.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyLatestRulesInput"
      responses:
        "202":
          description: Durable background task created

  /admin/background-tasks:
    get:
      operationId: listAdminBackgroundTasks
      tags: [resources]
      summary: List durable background tasks created by the current administrator
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Background tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackgroundTask" }

  /admin/background-tasks/{id}/retry:
    post:
      operationId: retryAdminBackgroundTask
      tags: [resources]
      summary: Retry a failed or externally paused background task
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: Background task queued again

  /admin/resources/bulk-review:
    post:
      operationId: bulkReviewResources
      tags: [resources]
      summary: Approve or reject selected pending resources
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkResourceReviewInput"
      responses:
        "200":
          description: Bulk review result

  /admin/review-log:
    get:
      operationId: listAdminReviewLog
      tags: [resources]
      security: [{ bearerAuth: [] }]
      summary: List completed administrator review decisions
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [approved, rejected] } }
        - { name: reviewedBy, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: Review log ordered by review time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewLogEntry" }

  /research-papers:
    get:
      operationId: listResearchPapers
      tags: [research]
      summary: List our team research papers
      responses:
        "200":
          description: List of research papers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchPaper"
    post:
      operationId: createResearchPaper
      tags: [research]
      summary: Upload a research paper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchPaperInput"
      responses:
        "201":
          description: Created paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPaper"

  /research-papers/{id}:
    get:
      operationId: getResearchPaper
      tags: [research]
      summary: Get a research paper by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Research paper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPaper"
        "404":
          description: Not found
    delete:
      operationId: deleteResearchPaper
      tags: [research]
      summary: Delete a research paper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /regulatory-entries:
    get:
      operationId: listRegulatoryEntries
      tags: [regulatory]
      summary: List regulatory timeline entries
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Regulatory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegulatoryEntry"
    post:
      operationId: createRegulatoryEntry
      tags: [regulatory]
      summary: Create a regulatory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulatoryEntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulatoryEntry"

  /regulatory-entries/timeline:
    get:
      operationId: getRegulatoryTimeline
      tags: [regulatory]
      summary: Get regulatory entries grouped by year for timeline view
      parameters:
        - name: lang
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Timeline grouped by year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegulatoryTimelineYear"

  /regulatory-entries/country-stats:
    get:
      operationId: getRegulatoryCountryStats
      tags: [regulatory]
      summary: Get count of regulatory entries per country
      responses:
        "200":
          description: Country statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryStat"

  /regulatory-entries/{id}:
    get:
      operationId: getRegulatoryEntry
      tags: [regulatory]
      summary: Get a regulatory entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Regulatory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulatoryEntry"
        "404":
          description: Not found

  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List all tags with usage counts
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"

  /authors:
    get:
      operationId: listAuthors
      tags: [resources]
      summary: List all authors with resource counts
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorSummary"

  /authors/{name}:
    get:
      operationId: getAuthor
      tags: [resources]
      summary: Get author profile with all their resources
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Author profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorProfile"
        "404":
          description: Not found
    patch:
      operationId: updateAuthorProfile
      tags: [resources]
      summary: Update author institution and bio
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthorProfile"
      responses:
        "200":
          description: Updated author profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorProfile"
        "404":
          description: Not found

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get overall platform statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /admin/resource-subscriptions:
    get:
      operationId: listResourceSubscriptions
      tags: [subscriptions]
      security: [{ bearerAuth: [] }]
      summary: List literature subscriptions
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResourceSubscription" }
    post:
      operationId: createResourceSubscription
      tags: [subscriptions]
      security: [{ bearerAuth: [] }]
      summary: Create a literature subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceSubscriptionInput" }
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSubscription" }

  /admin/resource-subscriptions/{id}:
    patch:
      operationId: updateResourceSubscription
      tags: [subscriptions]
      security: [{ bearerAuth: [] }]
      summary: Update a literature subscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceSubscriptionInput" }
      responses:
        "200": { description: Updated subscription }
    delete:
      operationId: deleteResourceSubscription
      tags: [subscriptions]
      security: [{ bearerAuth: [] }]
      summary: Delete a literature subscription and its candidates
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }

  /admin/resource-subscriptions/{id}/run:
    post:
      operationId: runResourceSubscription
      tags: [subscriptions]
      security: [{ bearerAuth: [] }]
      summary: Run one subscription immediately
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Discovery summary

  /admin/subscription-candidates:
    get:
      operationId: listSubscriptionCandidates
      tags: [subscriptions]
      security: [{ bearerAuth: [] }]
      summary: List private literature candidates
      parameters:
        - { name: status, in: query, schema: { type: string, default: new } }
      responses:
        "200":
          description: Candidate list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubscriptionCandidate" }

  /admin/subscription-candidates/import:
    post:
      operationId: importSubscriptionCandidates
      tags: [subscriptions]
      security: [{ bearerAuth: [] }]
      summary: Send selected candidates to the AI upload queue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateImportInput" }
      responses:
        "202": { description: Candidates queued }

  /resources/upload/jobs/reenrich:
    post:
      operationId: reenrichUploadJobs
      tags: [resources]
      security: [{ bearerAuth: [] }]
      summary: Retry missing AI and scholarly metadata for upload jobs
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReenrichJobsInput" }
      responses:
        "202": { description: Enrichment queued }

  /resources/upload/jobs/{id}/retry:
    post:
      operationId: retryUploadJob
      tags: [resources]
      security: [{ bearerAuth: [] }]
      summary: Retry one failed upload job from its persisted source
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "202": { description: Upload job queued again }
        "409": { description: Original source is no longer recoverable }

  /resources/upload/jobs/retry-failed:
    post:
      operationId: retryFailedUploadJobs
      tags: [resources]
      security: [{ bearerAuth: [] }]
      summary: Retry selected failed upload jobs
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadJobIdsInput" }
      responses:
        "202": { description: Recoverable jobs queued again }

  /resources/upload/jobs/delete-duplicates:
    post:
      operationId: deleteDuplicateUploadJobs
      tags: [resources]
      security: [{ bearerAuth: [] }]
      summary: Delete review jobs confirmed by a live check to duplicate library resources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadJobIdsInput" }
      responses:
        "200": { description: Duplicate upload jobs deleted }

  /resources/upload/jobs/reference-list:
    post:
      operationId: queueReferenceListUpload
      tags: [resources]
      security: [{ bearerAuth: [] }]
      summary: Queue a Word or Markdown bibliography for background decomposition
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReferenceListUploadForm"
      responses:
        "202":
          description: Reference list accepted for background processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadJobAccepted" }
        "400": { description: Unsupported or missing file }
        "401": { description: Authentication required }
        "413": { description: Extracted reference list is too long }
        "422": { description: Too little extractable text }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ResourceSubscriptionInput:
      type: object
      required: [name, query]
      properties:
        name: { type: string }
        query: { type: string }
        frequency: { type: string, enum: [daily, weekly], default: weekly }
        active: { type: boolean, default: true }

    CandidateImportInput:
      type: object
      required: [candidateIds]
      properties:
        candidateIds: { type: array, maxItems: 100, items: { type: integer } }

    ReenrichJobsInput:
      type: object
      properties:
        jobIds: { type: array, maxItems: 100, items: { type: integer } }

    UploadJobIdsInput:
      type: object
      required: [jobIds]
      properties:
        jobIds: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }

    ReviewLogEntry:
      type: object
      required: [id, title, status, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string, enum: [approved, rejected] }
        submitterEmail: { type: [string, "null"], format: email }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewerEmail: { type: [string, "null"], format: email }
        rejectionReasonId: { type: [integer, "null"] }
        rejectionNote: { type: [string, "null"] }

    UploadJobAccepted:
      type: object
      required: [batchId, jobIds]
      properties:
        batchId: { type: string, format: uuid }
        folderImportId: { type: [string, "null"], format: uuid }
        jobIds: { type: array, items: { type: integer } }

    ReferenceListUploadForm:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        sourceType: { type: string }
        folderImportId: { type: string, format: uuid }

    AiPreReviewInput:
      type: object
      required: [resourceIds]
      properties:
        resourceIds: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }
        force: { type: boolean, default: false }

    ApplyLatestRulesInput:
      type: object
      required: [resourceIds]
      properties:
        resourceIds: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }

    BackgroundTask:
      type: object
      required: [id, type, status, payload, total, processed, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer }
        type: { type: string }
        status: { type: string, enum: [queued, processing, waiting_external, completed, failed] }
        payload: { type: object, additionalProperties: true }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        total: { type: integer }
        processed: { type: integer }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }

    BulkResourceReviewInput:
      type: object
      required: [resourceIds, action]
      properties:
        resourceIds: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }
        action: { type: string, enum: [approve, reject] }
        rejectionReasonId: { type: integer }
        rejectionNote: { type: string, maxLength: 2000 }

    ResourceSubscription:
      allOf:
        - $ref: "#/components/schemas/ResourceSubscriptionInput"
        - type: object
          required: [id, sources, nextRunAt, createdAt, updatedAt]
          properties:
            id: { type: integer }
            sources: { type: array, items: { type: string } }
            lastCheckedAt: { type: [string, "null"], format: date-time }
            nextRunAt: { type: string, format: date-time }
            lastError: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SubscriptionCandidate:
      type: object
      required: [id, subscriptionId, externalKey, source, title, authors, status, discoveredAt]
      properties:
        id: { type: integer }
        subscriptionId: { type: integer }
        externalKey: { type: string }
        source: { type: string }
        title: { type: string }
        authors: { type: array, items: { type: string } }
        year: { type: [integer, "null"] }
        abstract: { type: [string, "null"] }
        doi: { type: [string, "null"] }
        url: { type: [string, "null"] }
        status: { type: string, enum: [new, imported, dismissed] }
        discoveredAt: { type: string, format: date-time }

    Resource:
      type: object
      required: [id, title, resource_type, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        title_zh:
          type: ["string", "null"]
        abstract:
          type: ["string", "null"]
        abstract_zh:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        authors:
          type: array
          items:
            type: string
        url:
          type: ["string", "null"]
        doi:
          type: ["string", "null"]
        resource_type:
          type: string
          enum: [paper, report, news, government_doc, blog, publication, forum, video]
        tags:
          type: array
          items:
            type: string
        published_date:
          type: ["string", "null"]
        journal:
          type: ["string", "null"]
        created_at:
          type: string
        aiReviewStatus:
          type: string
          enum: [not_started, processing, safe, needs_verification, high_risk, failed]
        aiReviewSummary:
          type: [string, "null"]
        aiReviewDetails:
          type: [object, "null"]
          additionalProperties: true
        aiReviewedAt:
          type: [string, "null"]
          format: date-time

    ResourceInput:
      type: object
      required: [title, resource_type]
      properties:
        title:
          type: string
        title_zh:
          type: string
        abstract:
          type: string
        abstract_zh:
          type: string
        keywords:
          type: array
          items:
            type: string
        authors:
          type: array
          items:
            type: string
        url:
          type: string
        doi:
          type: string
        resource_type:
          type: string
        tags:
          type: array
          items:
            type: string
        published_date:
          type: string
        journal:
          type: string

    ResourceUpdate:
      type: object
      properties:
        title:
          type: string
        title_zh:
          type: string
        abstract:
          type: string
        abstract_zh:
          type: string
        keywords:
          type: array
          items:
            type: string
        authors:
          type: array
          items:
            type: string
        url:
          type: string
        doi:
          type: string
        resource_type:
          type: string
        tags:
          type: array
          items:
            type: string
        published_date:
          type: string
        journal:
          type: string
        resubmit:
          type: boolean
          description: Treat an owner's edit as a resubmission even when the owner is also an administrator.

    ExtractionInput:
      type: object
      properties:
        url:
          type: string
        doi:
          type: string
        text:
          type: string
        source_type:
          type: string
